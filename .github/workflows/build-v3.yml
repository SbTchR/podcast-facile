name: Build and publish Podcast Facile V3 standard

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'app-parts/**'
      - '.github/workflows/build-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-v3-standard
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package.json

      - name: Reconstruire les sources complètes
        run: bash app/scripts/reconstruct-podcast-source.sh

      - name: Installer FFmpeg pour analyser les transitions
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installer les dépendances
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Vérifier les sources corrigées
        run: bash app/scripts/verify-audio-source.sh

      - name: Vérifier TypeScript
        working-directory: app
        run: npm run check

      - name: Compiler l’application
        working-directory: app
        run: npm run build

      - name: Vérifier le résultat compilé
        run: bash app/scripts/verify-audio-build.sh

      - name: Installer le site à l’adresse canonique
        run: python3 app/scripts/install-static-site.py

      - name: Publier le site généré
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site index.html app/package-lock.json
          if git diff --cached --quiet; then
            echo "Aucun changement généré à publier."
          else
            git commit -m "Publier les corrections audio"
            git push origin HEAD:main
          fi
